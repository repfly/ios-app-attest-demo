<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Attest Dashboard</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --border: #e3e3e8;
    --pass: #1a7f37; --pass-bg: #e8f6ec; --fail: #c62828; --fail-bg: #fdecec;
    --skip: #8a8a8e; --skip-bg: #f0f0f3; --warn: #8a5a00; --warn-bg: #fff4dc; --accent: #0066cc;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113; --card: #1c1c1f; --text: #f2f2f5; --muted: #9a9aa0; --border: #2e2e33;
      --pass: #4cc46a; --pass-bg: #15301d; --fail: #ff6b6b; --fail-bg: #3a1a1a;
      --skip: #8a8a90; --skip-bg: #26262a; --warn: #ffc65c; --warn-bg: #362a10; --accent: #4da3ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; }
  .status { font-size: 13px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--pass); margin-right: 6px; vertical-align: middle; }
  .dot.off { background: var(--fail); }
  button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
           background: var(--card); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .grid { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 14px; }
  .grid dt { color: var(--muted); }
  .grid dd { margin: 0; font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
  .warning { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 14px; margin-top: 10px; font-size: 14px; overflow-wrap: anywhere; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 8px; border-bottom: 1px solid var(--border); }
  td.mono { font-family: var(--mono); font-size: 13px; }
  tr:last-child td { border-bottom: none; }
  .empty { color: var(--muted); font-size: 14px; }
  .event { margin-bottom: 12px; }
  .event-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .badge.pass { background: var(--pass-bg); color: var(--pass); }
  .badge.fail { background: var(--fail-bg); color: var(--fail); }
  .badge.sim { background: var(--warn-bg); color: var(--warn); }
  td .badge.sim { margin-left: 8px; }
  .kind { font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; font-family: var(--mono); }
  .message { font-size: 14px; margin-bottom: 8px; }
  ol.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  ol.checks li { display: grid; grid-template-columns: 22px minmax(180px, 34%) 1fr; gap: 8px; align-items: start;
                 padding: 6px 10px; border-radius: 8px; font-size: 13.5px; }
  ol.checks li.passed { background: var(--pass-bg); }
  ol.checks li.failed { background: var(--fail-bg); }
  ol.checks li.skipped { background: var(--skip-bg); color: var(--skip); }
  .icon { font-weight: 700; text-align: center; }
  li.passed .icon { color: var(--pass); }
  li.failed .icon { color: var(--fail); }
  .check-name { font-weight: 500; }
  .check-detail { color: var(--muted); overflow-wrap: anywhere; }
  li.failed .check-detail { color: var(--text); }
  @media (max-width: 640px) {
    ol.checks li { grid-template-columns: 22px 1fr; }
    .check-detail { grid-column: 2; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>App Attest Dashboard</h1>
    <div>
      <span class="status" id="conn"><span class="dot"></span>connecting…</span>
      <button id="reset" type="button">Reset server</button>
    </div>
  </header>

  <section class="card">
    <dl class="grid">
      <dt>App ID</dt><dd id="appid">—</dd>
      <dt>Root CA</dt><dd id="rootca">—</dd>
      <dt id="testroot-label" hidden>Test root</dt><dd id="testroot" hidden>—</dd>
    </dl>
    <div id="simbanner"></div>
    <div id="warnings"></div>
  </section>

  <h2>Registered keys</h2>
  <section class="card" id="keys"><p class="empty">No devices registered yet.</p></section>

  <h2>Events (newest first)</h2>
  <section id="events"><p class="empty">No requests yet. Register the device from the app.</p></section>
</main>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);

  // Element helper: text only, never innerHTML with server data.
  function el(tag, className, text) {
    const n = document.createElement(tag);
    if (className) n.className = className;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }

  function fmtTime(ms) {
    const d = new Date(ms);
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  const ICON = { passed: "✓", failed: "✕", skipped: "–" };

  function renderConfig(s) {
    $("appid").textContent = s.appID + (s.appIDIsPlaceholder ? "  (placeholder)" : "");
    $("rootca").textContent = s.rootCALoaded ? "Loaded (" + s.rootCAPath.split("/").pop() + ")" : "NOT LOADED (" + s.rootCAPath + ")";
    const sim = !!s.simulatedModeEnabled;
    $("testroot-label").hidden = !sim; $("testroot").hidden = !sim;
    $("testroot").textContent = sim ? (s.testRootSubject || "") + "  (in memory, simulated)" : "—";
    $("simbanner").replaceChildren(...(sim ? [el("div", "warning",
      "Simulated mode is on (ALLOW_SIMULATED=1). Attestations anchored to the in-memory test root are accepted and marked SIMULATED. They exercise this server's checks but are not real App Attest.")] : []));
    const w = $("warnings");
    w.replaceChildren(...s.warnings.map((t) => el("div", "warning", "⚠ " + t)));
  }

  function renderKeys(keys) {
    const box = $("keys");
    if (!keys.length) { box.replaceChildren(el("p", "empty", "No devices registered yet.")); return; }
    const table = el("table");
    const head = el("tr");
    ["Key ID", "Environment", "Counter", "Registered"].forEach((h) => head.appendChild(el("th", null, h)));
    table.appendChild(head);
    keys.forEach((k) => {
      const tr = el("tr");
      const id = el("td", "mono", k.shortKeyId);
      id.title = k.keyId;
      const env = el("td", null, k.environment);
      if (k.simulated) env.appendChild(el("span", "badge sim", "SIMULATED"));
      tr.append(id, env, el("td", "mono", k.counter), el("td", null, fmtTime(k.registeredAt)));
      table.appendChild(tr);
    });
    box.replaceChildren(table);
  }

  function renderEvents(events) {
    const box = $("events");
    if (!events.length) { box.replaceChildren(el("p", "empty", "No requests yet. Register the device from the app.")); return; }
    box.replaceChildren(...events.map((e) => {
      const card = el("article", "card event");
      const head = el("div", "event-head");
      head.append(
        el("span", "badge " + (e.passed ? "pass" : "fail"), e.passed ? "ACCEPTED" : "REJECTED"),
        ...(e.simulated ? [el("span", "badge sim", "SIMULATED")] : []),
        el("span", "kind", e.kind === "attest" ? "Attestation" : e.kind === "transfer" ? "Protected transfer" : e.kind),
        el("span", "meta", fmtTime(e.timestamp) + (e.keyId ? "  ·  key " + e.keyId : ""))
      );
      card.append(head, el("div", "message", e.message));
      const list = el("ol", "checks");
      (e.checks || []).forEach((c) => {
        const li = el("li", c.status);
        li.append(el("span", "icon", ICON[c.status] || "?"), el("span", "check-name", c.name), el("span", "check-detail", c.detail));
        list.appendChild(li);
      });
      card.appendChild(list);
      return card;
    }));
  }

  let lastJSON = "";
  async function poll() {
    try {
      const r = await fetch("/state", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const text = await r.text();
      setConn(true);
      if (text !== lastJSON) {
        lastJSON = text;
        const s = JSON.parse(text);
        renderConfig(s); renderKeys(s.keys); renderEvents(s.events);
      }
    } catch (err) {
      setConn(false);
    } finally {
      setTimeout(poll, 1000);
    }
  }

  function setConn(ok) {
    const c = $("conn");
    const dot = el("span", ok ? "dot" : "dot off");
    c.replaceChildren(dot, document.createTextNode(ok ? "live" : "server unreachable"));
  }

  $("reset").addEventListener("click", async () => {
    if (!confirm("Clear all registered keys, challenges and events on the server?")) return;
    await fetch("/reset", { method: "POST" });
    lastJSON = "";
  });

  poll();
})();
</script>
</body>
</html>
